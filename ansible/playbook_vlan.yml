---
# Provision VLANs on lab switches with Ansible.
# Run: ansible-playbook ansible/playbook_vlan.yml -i ansible/inventory.ini --ask-pass
- name: Configure VLANs on lab switches
  hosts: lab_switches
  gather_facts: false
  vars:
    vlans:
      - { id: 10, name: Users }
      - { id: 20, name: Servers }
      - { id: 30, name: Voice }
      - { id: 99, name: Mgmt }
  tasks:
    - name: Create VLANs
      cisco.ios.ios_config:
        lines:
          - "vlan {{ item.id }}"
          - "name {{ item.name }}"
      loop: "{{ vlans }}"
